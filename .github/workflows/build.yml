name: Build Verdant Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            name: 'Linux (AppImage + deb)'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows (NSIS)'

    runs-on: ${{ matrix.platform }}
    name: Build for ${{ matrix.name }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias do Node
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || '' }}

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Verdant Launcher ${{ github.ref_name }}'
          releaseBody: |
            ## Novidades nesta versao
            Veja o changelog completo no README.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar e publicar updater.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Espera um pouco para garantir que os assets da release estao disponiveis
          sleep 10
          
          # Baixa apenas os arquivos de assinatura da release atual
          gh release download $VERSION -p "*.sig"
          
          # Extrai o conteudo das assinaturas
          WIN_SIG=$(cat *nsis.zip.sig)
          LINUX_SIG=$(cat *AppImage.tar.gz.sig)
          
          # Salva a data atual no formato ISO 8601
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Cria o verdant-updater.json dinamicamente
          cat <<EOF > verdant-updater.json
          {
            "version": "$VERSION",
            "notes": "Nova versao lanÃ§ada! Veja o Github para mais detalhes.",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "https://github.com/itsnikotina/VerdantLauncher/releases/download/$VERSION/Verdant.Launcher_${VERSION#v}_x64-setup.nsis.zip"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "https://github.com/itsnikotina/VerdantLauncher/releases/download/$VERSION/verdant-launcher_${VERSION#v}_amd64.AppImage.tar.gz"
              }
            }
          }
          EOF
          
          # Comita e envia o updater de volta para a branch main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add verdant-updater.json
          git commit -m "chore: auto-update verdant-updater.json para $VERSION [skip ci]" || echo "Nenhuma mudanca no updater"
          git push origin main

